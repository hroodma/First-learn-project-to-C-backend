syntax = "proto3";

option csharp_namespace = "WarehouseApi.Grpc";

package warehouse;

service Warehouse {
    rpc GetProduct (GetProductRequest) returns (ProductResponse);
}

message GetProductRequest {
    int32 id = 1;
}

message ProductResponse {
    int32 id = 1;
    string name = 2;
    string price = 3;
}